# runware-eval recipe. Calls the user's own Runware Serverless app (see serverless/trainer/app.py).
id: klein4b-relight-lora
taskType: serverlessEndpoint
model: serverless:klein-relight-trainer-b
serverless:
  app: klein-relight-trainer-b
  endpoint: sample
  imageKey: image
  secondsKey: seconds
  gpuPricePerSecond: 0.00044444   # L40S, from `runware serverless gpus` (2026-11-11)
params:
  checkpoint: 1500
  image: $input.base64
  prompt: >-
    Relight this product photo with one hard key light from the upper left: bright left and top surfaces, deep
    shadow on the right side, and a dark, well-defined shadow cast to the right. Keep the product, the white
    background and the framing exactly the same.
  size: 1024
  seed: $seed
price: 0.0015
notes: >-
  The student after training: FLUX.2 [klein] 4B (4-step distilled) with the relight LoRA trained on 85 pairs made by
  MiniMax H3 (512 px, 1500 steps, rank 32), served from a Runware Serverless app on one L40S. Words only, no
  reference image, at 1024 px (the untrained klein recipes ran at 2048). The seed is the draw's number: the
  endpoint needs one, so the draws differ and repeat on a re-run. Cost is the handler's GPU seconds times the
  L40S rate; cold start and idle time are billed by Serverless and are not in it. None of these products was in the
  training set.
